<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>heritage-archive</title>
    <!-- Fonts to match Nirvaha clarity -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- SVG Filter for Cloth/Flag Wave Effect -->
    <svg width="0" height="0" style="position: absolute;">
      <filter id="flag-wave">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.008" numOctaves="2" result="turbulence">
          <animate attributeName="baseFrequency" values="0.012 0.008; 0.016 0.012; 0.012 0.008" dur="10s" repeatCount="indefinite" />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="25" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
