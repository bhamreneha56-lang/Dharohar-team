<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>heritage-archive</title>
  </head>
  <body>
    <!-- SVG Filter for Cloth/Flag Wave Effect -->
    <svg width="0" height="0" style="position: absolute;">
      <filter id="flag-wave">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.008" numOctaves="2" result="turbulence">
          <animate attributeName="baseFrequency" values="0.012 0.008; 0.016 0.012; 0.012 0.008" dur="10s" repeatCount="indefinite" />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="25" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
